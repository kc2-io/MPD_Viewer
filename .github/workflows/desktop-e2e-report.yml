name: Desktop E2E Report

on:
  workflow_run:
    workflows: [Desktop E2E]
    types: [requested, in_progress, completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: desktop-e2e-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    name: PR evidence comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Create or update PR evidence comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/e2e-pr-report.py --write
