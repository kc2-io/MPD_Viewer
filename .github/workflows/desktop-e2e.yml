name: Desktop E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended:
        description: Run extended cases and Intel macOS
        type: boolean
        default: true
      checkpoints:
        description: Capture a screenshot checkpoint after each GUI case
        type: boolean
        default: true
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Change impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      reason: ${{ steps.classify.outputs.reason }}
      base: ${{ steps.classify.outputs.base }}
      head: ${{ steps.classify.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - name: Classify the checked-out change
        id: classify
        shell: bash
        env:
          MPD_CI_EVENT_NAME: ${{ github.event_name }}
          MPD_CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MPD_CI_HEAD: ${{ github.sha }}
        run: |
          if [[ "$MPD_CI_EVENT_NAME" == 'schedule' || "$MPD_CI_EVENT_NAME" == 'workflow_dispatch' ]]; then
            just ci-impact-full
          else
            just ci-impact
          fi >> "$GITHUB_OUTPUT"
  desktop:
    name: GUI (${{ matrix.platform }})
    needs: impact
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.impact.result == 'success' && needs.impact.outputs.full == 'false' && '[{"os":"ubuntu-24.04","platform":"Not-required","full":false}]' || ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended) || contains(github.event.pull_request.labels.*.name, 'desktop-e2e-extended')) && '[{"os":"windows-2025","platform":"Windows-x64","full":true},{"os":"macos-15","platform":"macOS-arm64","full":true},{"os":"ubuntu-22.04","platform":"Linux-x64","full":true},{"os":"macos-15-intel","platform":"macOS-x64","full":true}]' || '[{"os":"windows-2025","platform":"Windows-x64","full":true},{"os":"macos-15","platform":"macOS-arm64","full":true},{"os":"ubuntu-22.04","platform":"Linux-x64","full":true}]')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: target/e2e-ci
      MPD_E2E_BINARY: ${{ github.workspace }}/target/e2e-ci/debug/mpd-tabber${{ matrix.platform == 'Windows-x64' && '.exe' || '' }}
      MPD_E2E_EXTENDED: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended) || contains(github.event.pull_request.labels.*.name, 'desktop-e2e-extended')) && '1' || '0' }}
      MPD_E2E_PLATFORM: ${{ matrix.platform }}
      MPD_E2E_BUILD_COMMIT: ${{ github.sha }}
      MPD_E2E_RECORD_VIDEO: '1'
      MPD_E2E_CHECKPOINTS: ${{ (github.event_name != 'workflow_dispatch' || inputs.checkpoints) && '1' || '0' }}
      MPD_CI_BASE: ${{ needs.impact.outputs.base }}
      MPD_CI_HEAD: ${{ needs.impact.outputs.head }}
      MPD_CI_REASON: ${{ needs.impact.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - name: Record non-build-only result
        if: ${{ !matrix.full }}
        run: just ci-e2e-not-required
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ matrix.full }}
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ matrix.full }}
        with:
          python-version: '3.13'
      - name: Install pinned Windows Rust toolchain in isolated home
        if: ${{ matrix.full && runner.os == 'Windows' }}
        run: python scripts/setup-ci-rustup.py
      - name: Install pinned E2E video tools
        if: ${{ matrix.full }}
        run: python scripts/install-e2e-ffmpeg.py
      - name: Initialize isolated evidence paths
        if: ${{ matrix.full }}
        run: python scripts/e2e-runtime-manifest.py
      - name: Linux native and desktop dependencies
        if: ${{ matrix.full && runner.os == 'Linux' }}
        shell: bash
        run: |
          bash scripts/install-linux-deps.sh
          sudo apt-get install -y xvfb dbus-x11 openbox x11-utils
      # Cache only fetched Cargo packages and this feature-specific target. Never
      # cache Cargo home wholesale, browser profiles, preferences or evidence.
      # Keep one immutable cache per dependency/toolchain/platform combination;
      # both Cargo builds still run against the current checkout on every hit.
      - name: Restore isolated Cargo E2E build cache
        if: ${{ matrix.full }}
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/e2e-ci/
          key: desktop-e2e-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-custom-protocol-normal-and-e2e-tests
          restore-keys: |
            desktop-e2e-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-custom-protocol-normal-and-e2e-tests-
      - name: Verify native host and locked toolchain
        if: ${{ matrix.full }}
        shell: bash
        run: |
          rustup show
          python scripts/verify-native-host.py "$MPD_E2E_PLATFORM"
          python scripts/release-tools.py require-lock
      - name: Install locked GUI harness
        if: ${{ matrix.full }}
        run: npm ci --prefix tests/e2e
      - name: Verify artifact isolation
        if: ${{ matrix.full }}
        run: python scripts/e2e-runner-test.py
      - name: Verify production excludes automation and fixture features
        if: ${{ matrix.full }}
        run: python scripts/e2e-release-boundary.py
      - name: Build and stage normal production-feature binary for exclusion probe
        if: ${{ matrix.full }}
        env:
          MPD_E2E_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          cargo build --locked -p mpd-tabber --features custom-protocol
          python scripts/e2e-no-driver-probe.py stage
      - name: Build isolated UNSIGNED GUI test binary
        if: ${{ matrix.full }}
        run: cargo build --locked -p mpd-tabber --features custom-protocol,e2e-tests
      # Preserve successfully compiled dependencies even when subsequent GUI
      # acceptance fails; this does not alter the GUI step's failure status.
      - name: Cache successfully built native binaries
        if: ${{ matrix.full && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/e2e-ci/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Run native GUI suite (Windows and macOS)
        if: ${{ matrix.full && runner.os != 'Linux' }}
        env:
          MPD_E2E_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        timeout-minutes: ${{ env.MPD_E2E_EXTENDED == '1' && 25 || 15 }}
        shell: bash
        run: |
          python scripts/e2e-runtime-manifest.py
          python scripts/e2e-no-driver-probe.py run
          npm test --prefix tests/e2e
      - name: Run native GUI suite (Linux virtual desktop)
        if: ${{ matrix.full && runner.os == 'Linux' }}
        env:
          MPD_E2E_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        timeout-minutes: ${{ env.MPD_E2E_EXTENDED == '1' && 25 || 15 }}
        shell: bash
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' bash scripts/e2e-linux-session.sh
      - name: Stage bounded GUI evidence
        if: ${{ matrix.full && always() }}
        shell: bash
        env:
          MPD_E2E_JOB_STATUS: ${{ job.status }}
        run: python scripts/e2e-stage-evidence.py
      - name: Validate visual evidence (advisory rollout)
        if: ${{ matrix.full && always() }}
        shell: bash
        run: python scripts/e2e-validate-evidence.py "$RUNNER_TEMP/mpd-e2e-upload" --mode advisory
      - name: Upload GUI evidence (never profiles or databases)
        id: evidence-upload
        if: ${{ matrix.full && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Desktop-E2E-${{ matrix.platform }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/mpd-e2e-upload/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          compression-level: 0
      - name: Summarize GUI evidence
        if: ${{ matrix.full && always() }}
        shell: bash
        env:
          MPD_E2E_JOB_STATUS: ${{ job.status }}
          MPD_E2E_UPLOAD_OUTCOME: ${{ steps.evidence-upload.outcome }}
          MPD_E2E_UPLOAD_URL: ${{ steps.evidence-upload.outputs.artifact-url }}
          MPD_E2E_UPLOAD_DIGEST: ${{ steps.evidence-upload.outputs.artifact-digest }}
        run: python scripts/e2e-job-summary.py "$RUNNER_TEMP/mpd-e2e-upload"
