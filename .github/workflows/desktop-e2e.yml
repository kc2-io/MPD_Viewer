name: Desktop E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended:
        description: Run extended cases and Intel macOS
        type: boolean
        default: true
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: GUI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && '[{"os":"windows-2025","platform":"Windows-x64"},{"os":"macos-15","platform":"macOS-arm64"},{"os":"ubuntu-22.04","platform":"Linux-x64"},{"os":"macos-15-intel","platform":"macOS-x64"}]' || '[{"os":"windows-2025","platform":"Windows-x64"},{"os":"macos-15","platform":"macOS-arm64"},{"os":"ubuntu-22.04","platform":"Linux-x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MPD_E2E_BINARY: ${{ github.workspace }}/target/debug/mpd-tabber${{ matrix.platform == 'Windows-x64' && '.exe' || '' }}
      MPD_E2E_EXTENDED: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && '1' || '0' }}
      MPD_E2E_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Initialize isolated evidence paths
        run: python scripts/e2e-runtime-manifest.py
      - name: Linux native and desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/install-linux-deps.sh
          sudo apt-get install -y xvfb dbus-x11 openbox x11-utils
      - name: Verify native host and locked toolchain
        shell: bash
        run: |
          rustup show
          python scripts/verify-native-host.py "$MPD_E2E_PLATFORM"
          python scripts/release-tools.py require-lock
      - name: Install locked GUI harness
        run: npm ci --prefix tests/e2e
      - name: Verify artifact isolation
        run: python scripts/e2e-runner-test.py
      - name: Build isolated UNSIGNED GUI test binary
        run: cargo build --locked -p mpd-tabber --features custom-protocol,e2e-tests
      - name: Run native GUI suite (Windows and macOS)
        if: runner.os != 'Linux'
        timeout-minutes: ${{ env.MPD_E2E_EXTENDED == '1' && 20 || 10 }}
        shell: bash
        run: |
          python scripts/e2e-runtime-manifest.py
          npm test --prefix tests/e2e
      - name: Run native GUI suite (Linux virtual desktop)
        if: runner.os == 'Linux'
        timeout-minutes: ${{ env.MPD_E2E_EXTENDED == '1' && 20 || 10 }}
        shell: bash
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' bash scripts/e2e-linux-session.sh
      - name: Stage bounded GUI evidence
        if: always()
        shell: bash
        env:
          MPD_E2E_JOB_STATUS: ${{ job.status }}
        run: python scripts/e2e-stage-evidence.py
      - name: Upload GUI evidence (never profiles or databases)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Desktop-E2E-${{ matrix.platform }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/mpd-e2e-upload/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
