name: Check POC
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Compile and test Rust
        run: cargo test --workspace --features mpd-tabber/custom-protocol
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Presentation tests
        run: node --test tests/view-model.test.mjs
      - name: Save resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-${{ runner.os }}
          path: Cargo.lock
